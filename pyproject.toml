[project]
name = "investment-agent-app"
version = "0.1.0"
description = "Multi-Agent Investment Committee Terminal with Strands and FastAPI"
readme = "README.md"
authors = [{ name = "Chanchal Kumar", email = "rrabshrivastava@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "strands-agents[ollama]",
    "streamlit>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "alpha-vantage>=3.0.0",
    "tavily-python>=0.3.0",
    "pandas>=2.2.0",
    "cachetools>=5.3.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "openai>=1.68.0,<3",
    "yfinance>=1.8.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.8.0",
]
